<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Wer braucht das Laub?</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Fredoka',sans-serif;color:#2b1a0e}
.scene{position:absolute;inset:0;opacity:0;transform-origin:50% 60%}
.scene>svg{position:absolute;inset:0;width:1280px;height:720px}
.tag{position:absolute;left:28px;top:24px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;transform-origin:0 0}
.tag b{font-size:44px;font-weight:700;background:#fffaf0;border:5px solid #5a3317;border-radius:22px;padding:2px 22px;box-shadow:0 5px 0 #5a3317}
.tag i{font-style:normal;font-size:30px;font-weight:500;background:#e8742a;color:#fff;border:4px solid #5a3317;border-radius:18px;padding:0 16px}
.lbl{position:absolute;font-size:32px;font-weight:700;background:#fffaf0;border:4px solid #5a3317;border-radius:16px;padding:2px 16px;white-space:nowrap;transform:translate(-50%,-50%);box-shadow:0 4px 0 #5a3317}
.lbl.warm{background:#ffcf6b}.lbl.cold{background:#d9efff}.lbl.green{background:#c9ecb0}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#fff;-webkit-text-stroke:3px #5a3317;paint-order:stroke fill;text-shadow:0 6px 0 #5a3317}
.emo{position:absolute;transform:translate(-50%,-50%);font-size:60px;line-height:1}
#over{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}
#sub{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:1180px;background:rgba(43,26,14,.82);color:#fff;
 font-family:'Andika',sans-serif;font-weight:700;font-size:27px;padding:6px 22px;border-radius:14px;text-align:center;line-height:1.25}
.card{position:absolute;width:380px;height:200px;background:#fffaf0;border:5px solid #5a3317;border-radius:24px;box-shadow:0 6px 0 #5a3317;overflow:hidden;transform-origin:50% 50%}
.card svg{position:absolute;left:6px;top:14px;width:170px;height:170px}
.card div{position:absolute;left:172px;right:8px;top:36px;font-size:27px;line-height:1.15}
.card div b{display:block;font-size:25px;color:#c2531b;white-space:nowrap}
</style></head><body><div id="stage"></div>
<script src="timeline.js"></script>
<script>
// ───────────── Hilfsfunktionen ─────────────
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,d)=>d<=0?(t>=a?1:0):cl((t-a)/d);
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const outBack=x=>{const c=1.7;return x<=0?0:1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){let s=seed>>>0||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function mixHex(a,b,p){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const c=[16,8,0].map(s=>Math.round(lerp((pa>>s)&255,(pb>>s)&255,p)));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
const INK='#5a3317';
const LEAFC=['#e8a33d','#d9662b','#c0392b','#f2c14e','#a0522d','#cf7a2a','#e07b39','#b8452a'];
// Platzieren / Animieren von SVG-Gruppen
function place(id,x,y,s=1,r=0,o=1,flip=false){const e=$(id);if(!e)return;e.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${(flip?-s:s).toFixed(3)} ${s.toFixed(3)})`);e.style.opacity=o}
function popG(id,t,a,x,y,s=1,r=0,d=.4){const p=prog(t,a,d);place(id,x,y,s*outBack(p),r,p>0?1:0)}
function op(id,v){const e=$(id);if(e)e.style.opacity=v}
// HTML-Elemente (Schilder) aufpoppen
function popH(id,t,a,d=.35){const e=$(id);if(!e)return;const p=prog(t,a,d);e.style.opacity=p>0?1:0;e.style.scale=outBack(p)}
function hideH(id,t,a,d=.3){const e=$(id);if(!e)return;const p=1-prog(t,a,d);e.style.opacity=Math.min(+e.style.opacity,p)}
const bob=(t,f=9,a=4)=>-Math.abs(Math.sin(t*f))*a;

// ───────────── Bausteine ─────────────
function leaf(x,y,r,s,c,extra=''){return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(0)}) scale(${s.toFixed(2)})" ${extra}><path d="M0 -22 C14 -12 14 10 0 22 C-14 10 -14 -12 0 -22Z" fill="${c}" stroke="#6b3e1f" stroke-width="1.6"/><path d="M0 -18 V27" stroke="#6b3e1f" stroke-width="1.6" stroke-linecap="round"/></g>`}
function leafField(x,y,w,h,n,seed,sc=1){const R=rng(seed);let s='';for(let i=0;i<n;i++)s+=leaf(x+R()*w,y+R()*h,R()*360,(.6+R()*.6)*sc,LEAFC[Math.floor(R()*LEAFC.length)]);return s}
// Laubhaufen: Kuppel aus Blättern; jedes Blatt ist ein Kind mit data-k (für schrittweises Aufbauen)
function mound(cx,by,w,h,n,seed,sc=1,base='#a3602a',palette=LEAFC){const R=rng(seed);let s=`<path data-base="1" d="M${cx-w/2} ${by} A${w/2} ${h} 0 0 1 ${cx+w/2} ${by} Z" fill="${base}"/>`;
 const L=[];for(let i=0;i<n;i++){const a=Math.PI*(.04+.92*R()),rr=Math.sqrt(R());L.push([cx+Math.cos(a)*w/2*rr,by-Math.sin(a)*h*rr*.95])}
 L.sort((p,q)=>p[1]-q[1]);L.reverse();
 L.forEach((p,i)=>{s+=leaf(p[0],p[1],R()*360,(.75+R()*.5)*sc,palette[Math.floor(R()*palette.length)],`data-k="${i}"`)});return s}
function reveal(id,p){const g=$(id);if(!g)return;const ks=g.querySelectorAll('[data-k]');const n=ks.length;ks.forEach((e,i)=>{e.style.opacity=i<p*n?1:0});const b=g.querySelector('[data-base]');if(b)b.style.opacity=cl(p*3)}
function tree(x,gy,h,w,seed,o={}){const R=rng(seed);let s=`<path d="M${x-w/2} ${gy} Q${x-w*.35} ${gy-h*.5} ${x-w*.3} ${gy-h} L${x+w*.3} ${gy-h} Q${x+w*.35} ${gy-h*.5} ${x+w/2} ${gy} Z" fill="${o.trunk||'#7a5230'}" stroke="${INK}" stroke-width="${o.sw??3}"/>`;
 s+=`<path d="M${x} ${gy-h*.55} L${x+w*1.6} ${gy-h*.8} M${x} ${gy-h*.7} L${x-w*1.5} ${gy-h*.95}" stroke="${o.trunk||'#7a5230'}" stroke-width="${w*.22}" stroke-linecap="round"/>`;
 if(!o.bare){const cols=o.cols||['#e8a33d','#d9662b','#f2c14e','#c9561f','#e3b23c'];for(let i=0;i<(o.n||14);i++){const a=R()*Math.PI*2,rr=R();s+=`<circle class="crown" cx="${(x+Math.cos(a)*w*2.3*rr).toFixed(1)}" cy="${(gy-h-w*.4+Math.sin(a)*w*1.4*rr).toFixed(1)}" r="${(w*(.7+R()*.6)).toFixed(1)}" fill="${cols[Math.floor(R()*cols.length)]}" stroke="${o.cs||'none'}" stroke-width="2"/>`}}
 return s}
// Wald-Hintergrund
function forest(id,o={}){const gy=o.gy??580;const sky=o.sky||['#ffe7b3','#fbc98a'];
 let s=`<defs><linearGradient id="${id}_sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
 <rect width="1280" height="720" fill="url(#${id}_sky)"/>`;
 const R=rng(o.seed||7);
 // ferne Bäume
 s+=`<g opacity=".55">`;for(let i=0;i<11;i++){const x=i*125+R()*60-20;s+=tree(x,gy,190+R()*120,22+R()*10,o.seed*13+i,{cols:['#d9a05b','#c98a4a','#e0b46a'],sw:0,trunk:'#9a7656',n:9})}s+=`</g>`;
 // nahe Bäume
 (o.trees||[[90,330,52],[1190,360,58]]).forEach((tt,i)=>{s+=tree(tt[0],gy+6,tt[1],tt[2],(o.seed||7)*7+i,{bare:o.bare})});
 // Boden
 s+=`<rect x="0" y="${gy}" width="1280" height="${720-gy}" fill="${o.ground||'#b8732e'}"/><path d="M0 ${gy} Q320 ${gy-12} 640 ${gy} T1280 ${gy}" fill="${o.ground||'#b8732e'}"/>`;
 if(!o.noLeaves)s+=leafField(-20,gy-6,1320,720-gy,o.nLeaves||150,(o.seed||7)+99);
 s+=`<rect id="${id}_frost" x="0" y="${gy-14}" width="1280" height="${734-gy}" fill="#fbfdff" opacity="0"/>`;
 return s}
// Erdreich im Querschnitt
function soil(id,gy,o={}){const R=rng(o.seed||3);let s=`<rect x="0" y="${gy}" width="1280" height="${720-gy}" fill="#7a4f2c"/>`;
 for(let i=0;i<40;i++)s+=`<ellipse cx="${(R()*1280).toFixed(0)}" cy="${(gy+20+R()*(700-gy)).toFixed(0)}" rx="${(4+R()*10).toFixed(0)}" ry="${(3+R()*6).toFixed(0)}" fill="${R()<.5?'#6a4325':'#8d6038'}"/>`;
 s+=`<rect x="0" y="${gy-4}" width="1280" height="16" fill="#5d3a1e"/>`;
 s+=leafField(-20,gy-14,1320,18,o.n||90,(o.seed||3)+5,.9);
 s+=`<rect id="${id}_frost" x="0" y="${gy-16}" width="1280" height="22" fill="#fbfdff" opacity="0"/>`;
 return s}
const ZZZ=(id)=>`<g id="${id}" opacity="0"><text x="0" y="0" font-family="Fredoka" font-weight="700" font-size="44" fill="#fff" stroke="${INK}" stroke-width="5" paint-order="stroke">Z</text><text x="30" y="-36" font-family="Fredoka" font-weight="700" font-size="34" fill="#fff" stroke="${INK}" stroke-width="5" paint-order="stroke">z</text><text x="54" y="-66" font-family="Fredoka" font-weight="700" font-size="26" fill="#fff" stroke="${INK}" stroke-width="4" paint-order="stroke">z</text></g>`;
function zzz(id,t,a){const g=$(id);if(!g)return;g.style.opacity=t>a?1:0;[...g.children].forEach((c,i)=>{const ph=((t-a)*.8+i*.33)%1;c.setAttribute('opacity',t>a?Math.sin(ph*Math.PI):0);c.setAttribute('transform',`translate(${ph*10} ${-ph*14})`)})}
const glow=(id,r,c='#ffd36b')=>`<defs><radialGradient id="${id}_g"><stop offset="0" stop-color="${c}" stop-opacity=".85"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs><circle id="${id}" r="${r}" fill="url(#${id}_g)" opacity="0"/>`;

// ───────────── Tiere (Seitenansicht, schauen nach rechts, Ursprung = Füße Mitte) ─────────────
const EYE=(x,y,r=6,closed=false)=>closed?`<path d="M${x-r} ${y} Q${x} ${y+r} ${x+r} ${y}" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="#1a1a1a"/><circle cx="${x+r*.35}" cy="${y-r*.35}" r="${r*.35}" fill="#fff"/>`;
function hedgehog(o={}){const cx=-12,cy=-50,rx=82,ry=50,N=30;let p=[];
 for(let i=0;i<=N;i++){const th=Math.PI*(1.06-.92*i/N),f=i%2?1.3:1.02;p.push(`${(cx+Math.cos(th)*rx*f).toFixed(1)},${(cy-Math.sin(th)*ry*f).toFixed(1)}`)}
 let lines='';for(let i=0;i<14;i++){const th=Math.PI*(.95-.75*i/13);const x=cx+Math.cos(th)*rx*.7,y=cy-Math.sin(th)*ry*.65;lines+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${(Math.cos(th)*14).toFixed(1)} ${(-Math.sin(th)*14).toFixed(1)}" stroke="#3a2614" stroke-width="3" stroke-linecap="round"/>`}
 return `<ellipse cx="-40" cy="-4" rx="15" ry="8" fill="#6b4a2f"/><ellipse cx="34" cy="-4" rx="15" ry="8" fill="#6b4a2f"/>
 <ellipse cx="${cx}" cy="${cy+8}" rx="${rx}" ry="${ry-4}" fill="#c9a37a" stroke="${INK}" stroke-width="3"/>
 <polygon points="${p.join(' ')} ${cx-rx*.9},${cy+26}" fill="#6a4a2c" stroke="#3a2614" stroke-width="3" stroke-linejoin="round"/>${lines}
 <path d="M38 -78 Q100 -62 128 -34 Q104 -8 36 -12 Z" fill="#dcb88d" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <circle cx="52" cy="-72" r="9" fill="#c49a6c" stroke="${INK}" stroke-width="2.5"/>
 <circle cx="129" cy="-35" r="8" fill="#1a1a1a"/>${EYE(84,-50,6,o.closed)}
 <path d="M104 -24 Q110 -20 116 -24" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 ${o.leaf?leaf(132,-22,70,1.1,'#e8a33d'):''}`}
function hedgehogBall(){let p=[];const N=36;for(let i=0;i<N;i++){const a=Math.PI*2*i/N,f=i%2?72:56;p.push(`${(Math.cos(a)*f).toFixed(1)},${(-58+Math.sin(a)*f*.86).toFixed(1)}`)}
 return `<polygon points="${p.join(' ')}" fill="#6a4a2c" stroke="#3a2614" stroke-width="3" stroke-linejoin="round"/>
 <ellipse cx="22" cy="-30" rx="30" ry="20" fill="#dcb88d" stroke="${INK}" stroke-width="3"/>${EYE(16,-34,6,true)}<circle cx="48" cy="-26" r="6" fill="#1a1a1a"/>`}
function mouse(o={}){return `<path d="M-42 -22 C-90 -8 -110 -44 -150 -22" stroke="#d6959a" stroke-width="5" fill="none" stroke-linecap="round"/>
 <ellipse cx="18" cy="-3" rx="12" ry="5" fill="#e9a3a8"/><ellipse cx="-24" cy="-3" rx="12" ry="5" fill="#e9a3a8"/>
 <ellipse cx="0" cy="-30" rx="48" ry="29" fill="#a07a55" stroke="${INK}" stroke-width="3"/>
 <ellipse cx="10" cy="-16" rx="30" ry="12" fill="#efe0c9"/>
 <ellipse cx="50" cy="-40" rx="28" ry="22" fill="#a07a55" stroke="${INK}" stroke-width="3"/>
 <path d="M64 -54 Q92 -42 90 -36 Q80 -26 60 -24 Z" fill="#a07a55" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <circle cx="36" cy="-64" r="18" fill="#a07a55" stroke="${INK}" stroke-width="3"/><circle cx="36" cy="-64" r="11" fill="#f0a8b0"/>
 <circle cx="90" cy="-38" r="5.5" fill="#e07b8a"/>${EYE(64,-46,6,o.closed)}
 <path d="M84 -34 l24 -6 M84 -32 l24 4" stroke="#4a3524" stroke-width="1.6"/>`}
function squirrel(o={}){return `<path d="M-14 -16 C-86 -6 -108 -84 -88 -136 C-72 -178 -20 -196 -2 -166 C8 -146 -26 -146 -42 -124 C-58 -98 -40 -52 -14 -16 Z" fill="#c4622d" stroke="${INK}" stroke-width="3"/>
 <path d="M-60 -60 C-75 -90 -70 -120 -50 -150" stroke="#e08a4f" stroke-width="6" fill="none" stroke-linecap="round"/>
 <ellipse cx="0" cy="-56" rx="32" ry="48" fill="#c4622d" stroke="${INK}" stroke-width="3"/>
 <ellipse cx="13" cy="-50" rx="17" ry="34" fill="#f5e4c8"/>
 <ellipse cx="-4" cy="-14" rx="30" ry="15" fill="#b5541f" stroke="${INK}" stroke-width="3"/><ellipse cx="24" cy="-4" rx="20" ry="6" fill="#b5541f" stroke="${INK}" stroke-width="2.5"/>
 <path d="M2 -136 L-6 -170 L22 -142 Z" fill="#b5541f" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <circle cx="22" cy="-114" r="29" fill="#c4622d" stroke="${INK}" stroke-width="3"/>
 <ellipse cx="46" cy="-106" rx="16" ry="12" fill="#c4622d" stroke="${INK}" stroke-width="3"/><ellipse cx="38" cy="-100" rx="12" ry="8" fill="#f5e4c8"/>
 <path d="M14 -138 L12 -174 L34 -140 Z" fill="#c4622d" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <circle cx="61" cy="-108" r="5" fill="#1a1a1a"/>${EYE(34,-120,6,o.closed)}
 ${o.nut?`<g transform="translate(46 -72)">${acorn()}</g>`:''}
 <ellipse cx="34" cy="-70" rx="10" ry="7" fill="#c4622d" stroke="${INK}" stroke-width="2.5"/>`}
function squirrelSleep(){return `<ellipse cx="0" cy="-42" rx="62" ry="42" fill="#c4622d" stroke="${INK}" stroke-width="3"/>
 <circle cx="40" cy="-44" r="26" fill="#c4622d" stroke="${INK}" stroke-width="3"/><path d="M30 -64 L30 -92 L48 -68 Z" fill="#c4622d" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 ${EYE(46,-46,6,true)}<circle cx="64" cy="-38" r="4.5" fill="#1a1a1a"/>
 <path d="M-60 -30 C-90 -80 -40 -110 10 -96 C40 -88 50 -70 30 -72 C-10 -80 -40 -60 -30 -10 Z" fill="#d06a32" stroke="${INK}" stroke-width="3"/>`}
function fox(o={}){return `<path d="M-72 -78 C-150 -86 -190 -40 -178 -8 C-150 -22 -110 -34 -70 -58 Z" fill="#e2711d" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <path d="M-178 -8 C-182 -28 -168 -40 -152 -36 C-150 -24 -160 -14 -178 -8 Z" fill="#fff7ea" stroke="${INK}" stroke-width="3"/>
 ${[-58,-32,38,62].map(x=>`<rect x="${x}" y="-52" width="13" height="52" rx="5" fill="#e2711d" stroke="${INK}" stroke-width="2.5"/><rect x="${x}" y="-20" width="13" height="20" rx="5" fill="#3a2a20"/>`).join('')}
 <ellipse cx="0" cy="-72" rx="82" ry="32" fill="#e2711d" stroke="${INK}" stroke-width="3"/>
 <ellipse cx="62" cy="-62" rx="22" ry="20" fill="#fff7ea"/>
 <path d="M66 -116 L70 -152 L92 -120 Z M84 -118 L98 -150 L106 -114 Z" fill="#e2711d" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <path d="M72 -126 L72 -142 L84 -124 Z M90 -122 L97 -140 L100 -120 Z" fill="#3a2a20"/>
 <path d="M54 -100 Q72 -128 104 -114 L146 -90 Q150 -82 140 -80 L98 -72 Q66 -70 54 -100 Z" fill="#e2711d" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <path d="M88 -88 L142 -82 L102 -73 Q90 -76 88 -88 Z" fill="#fff7ea"/>
 <circle cx="146" cy="-88" r="6" fill="#1a1a1a"/>${EYE(104,-102,5.5,o.closed)}`}
function foxSleep(){return `<ellipse cx="0" cy="-46" rx="96" ry="46" fill="#e2711d" stroke="${INK}" stroke-width="3"/>
 <path d="M30 -84 L36 -118 L54 -88 Z M50 -86 L64 -116 L70 -82 Z" fill="#e2711d" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <ellipse cx="50" cy="-62" rx="34" ry="28" fill="#e2711d" stroke="${INK}" stroke-width="3"/>${EYE(50,-66,7,true)}
 <path d="M-96 -40 C-100 0 40 6 96 -22 C108 -30 100 -44 86 -40 C40 -24 -40 -18 -70 -52 Z" fill="#ec8a3a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <path d="M60 -30 C80 -36 96 -44 104 -30 C100 -16 80 -14 62 -20 Z" fill="#fff7ea" stroke="${INK}" stroke-width="3"/>`}
function boar(o={}){const legs=o.lying?'':[-74,-46,46,72].map(x=>`<rect x="${x}" y="-48" width="17" height="48" rx="5" fill="#3e2f24" stroke="${INK}" stroke-width="2.5"/>`).join('');
 let br='';for(let i=0;i<16;i++){const x=-80+i*11,y=-128+Math.pow((i-7)/8,2)*20;br+=`<path d="M${x} ${y+6} l${3} ${-14}" stroke="#2c211a" stroke-width="4" stroke-linecap="round"/>`}
 return `${legs}<path d="M-106 -96 q-14 -6 -10 -18" stroke="#3e2f24" stroke-width="4" fill="none" stroke-linecap="round"/>
 <ellipse cx="0" cy="-82" rx="110" ry="52" fill="#5e4a3b" stroke="${INK}" stroke-width="3"/>${br}
 <path d="M64 -124 Q122 -112 164 -74 L172 -50 Q152 -38 130 -42 Q88 -44 64 -60 Z" fill="#54412f" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <ellipse cx="170" cy="-62" rx="8" ry="14" fill="#b49488" stroke="${INK}" stroke-width="3"/><circle cx="170" cy="-66" r="2" fill="#2c211a"/><circle cx="170" cy="-57" r="2" fill="#2c211a"/>
 <path d="M146 -46 Q150 -62 160 -64" stroke="#fffaf0" stroke-width="5" fill="none" stroke-linecap="round"/>
 <path d="M92 -118 L80 -146 L110 -122 Z" fill="#54412f" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>${EYE(116,-90,5,o.closed)}`}
function badger(o={}){const legs=o.lying?'':[-60,-36,40,62].map(x=>`<rect x="${x}" y="-32" width="18" height="32" rx="6" fill="#1f1f1f"/>`).join('');
 let hair='';for(let i=0;i<12;i++){const x=-70+i*12;hair+=`<path d="M${x} -70 l6 10" stroke="#7d7d7d" stroke-width="2.5" stroke-linecap="round"/>`}
 return `${legs}<ellipse cx="0" cy="-50" rx="92" ry="38" fill="#9b9b9b" stroke="${INK}" stroke-width="3"/>${hair}
 <path d="M-92 -54 q-18 2 -20 12" stroke="#9b9b9b" stroke-width="8" fill="none" stroke-linecap="round"/>
 <path d="M58 -74 Q96 -92 154 -46 Q150 -36 138 -36 Q96 -30 56 -36 Z" fill="#fafafa" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
 <path d="M66 -80 Q100 -80 150 -48 L144 -44 Q100 -62 70 -62 Z" fill="#1f1f1f"/>
 <circle cx="70" cy="-80" r="9" fill="#fafafa" stroke="${INK}" stroke-width="2.5"/>
 <circle cx="152" cy="-44" r="6" fill="#1a1a1a"/>${o.closed?`<path d="M100 -64 q6 4 12 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`:`<circle cx="106" cy="-64" r="4.5" fill="#fff"/><circle cx="107" cy="-64" r="2.5" fill="#1a1a1a"/>`}

const over=document.createElementNS('http://www.w3.org/2000/svg','svg');over.id='over';over.setAttribute('viewBox','0 0 1280 720');
(()=>{const R=rng(2024);let s='';for(let i=0;i<18;i++)s+=`<g class="fl" data-x="${R()*1280}" data-v="${40+R()*50}" data-p="${R()}" data-s="${.7+R()*.6}">${leaf(0,0,0,1,LEAFC[i%8])}</g>`;
 for(let i=0;i<90;i++)s+=`<circle class="sn" data-x="${R()*1280}" data-v="${40+R()*60}" data-p="${R()}" r="${2.5+R()*4}" fill="#fff" opacity=".9"/>`;over.innerHTML=s})();
function overlay(T,fall,snow){
 over.querySelectorAll('.fl').forEach((e,i)=>{const v=+e.dataset.v,ph=+e.dataset.p;const on=(i/18)<fall;const y=((T*v+ph*800)%820)-60;const x=+e.dataset.x+Math.sin(T*1.2+ph*9)*40;
  e.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(T*60+ph*360)%360}) scale(${e.dataset.s})`);e.style.opacity=on?1:0});
 over.querySelectorAll('.sn').forEach((e,i)=>{const v=+e.dataset.v,ph=+e.dataset.p;const on=(i/90)<snow;const y=((T*v+ph*780)%780)-30;
  e.setAttribute('cx',(+e.dataset.x+Math.sin(T+ph*7)*20).toFixed(1));e.setAttribute('cy',y.toFixed(1));e.style.opacity=on? 0.9:0});
}

// ───────────── Aufbau & Render ─────────────
const stage=$('stage');const SCN=TL.scenes;
SCN.forEach(s=>{const d=document.createElement('div');d.className='scene';d.id='sc_'+s.id;d.innerHTML=SC[s.id].html();stage.appendChild(d)});
stage.appendChild(over);const sub=document.createElement('div');sub.id='sub';stage.appendChild(sub);
window.TOTAL=TL.total;
function render(T){
 let idx=SCN.findIndex(s=>T<s.start+s.dur);if(idx<0)idx=SCN.length-1;
 const sc=SCN[idx],t=T-sc.start,obj=SC[sc.id];
 const S=k=>sc.sents[Math.min(k,sc.sents.length-1)].t, F=(k,f)=>{const q=sc.sents[Math.min(k,sc.sents.length-1)];return q.t+q.d*f};
 SCN.forEach((s,i)=>{if(i!==idx)$('sc_'+s.id).style.opacity=0});
 const el=$('sc_'+sc.id);const fin=idx===0?1:ease(prog(t,0,.45));const fout=idx===SCN.length-1?1-prog(t,sc.dur-.8,.8):1;
 el.style.opacity=fin*fout;el.style.transform=`scale(${1+.025*t/sc.dur})`;
 obj.anim(t,S,F);
 if(over.parentNode!==el)el.insertBefore(over,el.children[1]||null);
 const fa=obj.fall?obj.fall(t):0,sn=obj.snow?obj.snow(t):0;overlay(T,fa,sn);over.style.opacity=fin*fout;
 let k=-1;sc.sents.forEach((q,i)=>{if(t>=q.t-.15)k=i});
 sub.style.opacity=k<0?0:fout;if(k>=0&&sub.textContent!==sc.sents[k].text)sub.textContent=sc.sents[k].text;
}
window.render=render;
document.fonts.ready.then(()=>{window.READY=true});
if(!location.search.includes('rec')){const p=new URLSearchParams(location.search);const t0=performance.now()-(+p.get('t')||0)*1000;
 if(p.has('still'))render(+p.get('t'));else (function loop(){render(((performance.now()-t0)/1000)%TOTAL);requestAnimationFrame(loop)})()}
</script></body></html>
